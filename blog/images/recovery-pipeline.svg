<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Recovery Pipeline — Engine structural recovery → Application triage</text>

  <!-- Engine zone -->
  <rect x="20" y="50" width="500" height="450" fill="#f1f5f9" rx="6" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="74" font-size="12" font-weight="600" fill="#475569">ENGINE (DefaultRecoveryCoordinator)</text>

  <!-- Life zone -->
  <rect x="540" y="50" width="260" height="450" fill="#f0fdf4" rx="6" stroke="#86efac" stroke-width="1"/>
  <text x="560" y="74" font-size="12" font-weight="600" fill="#166534">LIFE (TriageHandler SPI)</text>

  <!-- Worker Failure -->
  <rect x="60" y="96" width="160" height="40" fill="#fef2f2" rx="4" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="140" y="121" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Worker Failure</text>

  <!-- RetryOrchestrator -->
  <rect x="60" y="168" width="160" height="40" fill="#fff" rx="4" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="193" text-anchor="middle" font-size="11" fill="#334155">RetryOrchestrator</text>

  <!-- Arrow: failure -> retry -->
  <line x1="140" y1="136" x2="140" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Retry decision diamond -->
  <polygon points="140,240 200,270 140,300 80,270" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="274" text-anchor="middle" font-size="10" fill="#334155">Retries left?</text>

  <!-- Arrow: retry -> diamond -->
  <line x1="140" y1="208" x2="140" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes: retry -->
  <text x="55" y="258" font-size="10" fill="#16a34a" font-weight="500">yes</text>
  <line x1="80" y1="270" x2="40" y2="270" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="40" y1="270" x2="40" y2="188" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="40" y1="188" x2="60" y2="188" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- No: exhausted -->
  <text x="210" y="258" font-size="10" fill="#dc2626" font-weight="500">no</text>
  <line x1="200" y1="270" x2="260" y2="270" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Error Classifier -->
  <rect x="270" y="250" width="130" height="40" fill="#fff" rx="4" stroke="#94a3b8" stroke-width="1"/>
  <text x="335" y="275" text-anchor="middle" font-size="11" fill="#334155">ErrorClassifier</text>

  <!-- Level boxes -->
  <rect x="270" y="320" width="100" height="34" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1"/>
  <text x="320" y="342" text-anchor="middle" font-size="10" fill="#1e40af">L1: Transient</text>

  <rect x="270" y="364" width="100" height="34" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1"/>
  <text x="320" y="386" text-anchor="middle" font-size="10" fill="#1e40af">L2: Compound</text>

  <rect x="270" y="408" width="100" height="34" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1"/>
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#1e40af">L3: Replan</text>

  <!-- Arrow: classifier -> levels -->
  <line x1="335" y1="290" x2="335" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Structural recovery failed label -->
  <rect x="390" y="372" width="120" height="28" fill="#fef2f2" rx="4" stroke="#fca5a5" stroke-width="1"/>
  <text x="450" y="391" text-anchor="middle" font-size="10" fill="#991b1b">All levels failed</text>

  <!-- Arrow: levels -> failed -->
  <line x1="370" y1="381" x2="390" y2="381" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Arrow: failed -> TriageHandler -->
  <line x1="510" y1="386" x2="540" y2="386" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- TriageHandler box -->
  <rect x="560" y="96" width="220" height="44" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="670" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">LifePlaybookTriageHandler</text>
  <text x="670" y="131" text-anchor="middle" font-size="10" fill="#166534">implements TriageHandler</text>

  <!-- Planning Worker -->
  <rect x="580" y="168" width="180" height="36" fill="#fff" rx="4" stroke="#86efac" stroke-width="1"/>
  <text x="670" y="191" text-anchor="middle" font-size="11" fill="#166534">Planning Worker (LLM)</text>

  <!-- Arrow: handler -> planner -->
  <line x1="670" y1="140" x2="670" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- TriageDecision -->
  <rect x="580" y="232" width="180" height="36" fill="#fff" rx="4" stroke="#86efac" stroke-width="1"/>
  <text x="670" y="255" text-anchor="middle" font-size="11" fill="#166534">TriageDecision (4 actions)</text>

  <!-- Arrow: planner -> decision -->
  <line x1="670" y1="204" x2="670" y2="232" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- TriageExecutor -->
  <rect x="580" y="296" width="180" height="36" fill="#fff" rx="4" stroke="#86efac" stroke-width="1"/>
  <text x="670" y="319" text-anchor="middle" font-size="11" fill="#166534">TriageExecutor</text>

  <!-- Arrow: decision -> executor -->
  <line x1="670" y1="268" x2="670" y2="296" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Four actions -->
  <rect x="560" y="360" width="110" height="26" fill="#ecfdf5" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="615" y="378" text-anchor="middle" font-size="9" fill="#166534">RETRY_MODIFIED</text>

  <rect x="560" y="392" width="110" height="26" fill="#ecfdf5" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="615" y="410" text-anchor="middle" font-size="9" fill="#166534">SWITCH_PLAYBOOK</text>

  <rect x="680" y="360" width="110" height="26" fill="#ecfdf5" rx="3" stroke="#86efac" stroke-width="1"/>
  <text x="735" y="378" text-anchor="middle" font-size="9" fill="#166534">GENERATE_FIX</text>

  <rect x="680" y="392" width="110" height="26" fill="#fef2f2" rx="3" stroke="#fca5a5" stroke-width="1"/>
  <text x="735" y="410" text-anchor="middle" font-size="9" fill="#991b1b">FALLBACK_MCP</text>

  <!-- Arrow: executor -> actions -->
  <line x1="670" y1="332" x2="670" y2="352" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="615" y1="352" x2="735" y2="352" stroke="#16a34a" stroke-width="1"/>
  <line x1="615" y1="352" x2="615" y2="360" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="735" y1="352" x2="735" y2="360" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- CBR Writer -->
  <rect x="580" y="444" width="180" height="36" fill="#fefce8" rx="4" stroke="#fde047" stroke-width="1"/>
  <text x="670" y="467" text-anchor="middle" font-size="11" fill="#854d0e">LifePlaybookCbrWriter</text>

  <!-- Arrow: actions -> cbr -->
  <line x1="670" y1="418" x2="670" y2="444" stroke="#eab308" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from failed to handler -->
  <line x1="560" y1="386" x2="560" y2="118" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
</svg>
