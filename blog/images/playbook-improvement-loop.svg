<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa" rx="8"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Playbook Improvement Loop — failures evolve the catalog</text>

  <!-- Catalog -->
  <rect x="40" y="60" width="140" height="60" fill="#eff6ff" rx="6" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Template</text>
  <text x="110" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Catalog</text>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#64748b">8 curated + N generated</text>

  <!-- Planning Worker selects -->
  <rect x="240" y="68" width="140" height="44" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">Planning Worker</text>

  <line x1="180" y1="90" x2="240" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="83" text-anchor="middle" font-size="9" fill="#64748b">selects</text>

  <!-- Playbook execution -->
  <rect x="440" y="68" width="130" height="44" fill="#fff" rx="4" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="505" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Playbook</text>
  <text x="505" y="103" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Execution</text>

  <line x1="380" y1="90" x2="440" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="83" text-anchor="middle" font-size="9" fill="#64748b">runs</text>

  <!-- Success path -->
  <rect x="630" y="60" width="100" height="30" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1"/>
  <text x="680" y="80" text-anchor="middle" font-size="11" fill="#166534">Success ✓</text>
  <line x1="570" y1="78" x2="630" y2="78" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Failure path -->
  <rect x="630" y="100" width="100" height="30" fill="#fef2f2" rx="4" stroke="#fca5a5" stroke-width="1"/>
  <text x="680" y="120" text-anchor="middle" font-size="11" fill="#991b1b">Failure ✗</text>
  <line x1="570" y1="102" x2="630" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Triage -->
  <rect x="540" y="170" width="180" height="44" fill="#fefce8" rx="4" stroke="#fde047" stroke-width="1.5"/>
  <text x="630" y="197" text-anchor="middle" font-size="12" font-weight="500" fill="#854d0e">Triage (LLM judgment)</text>

  <line x1="680" y1="130" x2="680" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="680" y1="155" x2="630" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="630" y1="155" x2="630" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GENERATE_FIX path -->
  <rect x="540" y="250" width="180" height="44" fill="#f0fdf4" rx="4" stroke="#86efac" stroke-width="1.5"/>
  <text x="630" y="268" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Validate + Persist</text>
  <text x="630" y="283" text-anchor="middle" font-size="10" fill="#166534">fixed template → catalog</text>

  <line x1="630" y1="214" x2="630" y2="250" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="660" y="237" font-size="9" fill="#16a34a">GENERATE_FIX</text>

  <!-- Loop back to catalog -->
  <line x1="540" y1="272" x2="110" y2="272" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="110" y1="272" x2="110" y2="130" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-a)"/>
  <text x="320" y="265" text-anchor="middle" font-size="10" font-weight="500" fill="#d97706">catalog updated — next case uses fixed version</text>

  <!-- CBR arrow -->
  <rect x="280" y="170" width="160" height="44" fill="#fefce8" rx="4" stroke="#fde047" stroke-width="1"/>
  <text x="360" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#854d0e">CBR Retention</text>
  <text x="360" y="204" text-anchor="middle" font-size="9" fill="#854d0e">per-failure record stored</text>

  <line x1="540" y1="192" x2="440" y2="192" stroke="#eab308" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- CBR feeds back to planning -->
  <line x1="360" y1="170" x2="360" y2="145" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="360" y1="145" x2="310" y2="145" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="310" y1="145" x2="310" y2="112" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-a)"/>
  <text x="360" y="140" font-size="9" fill="#d97706">informs next selection</text>

  <!-- RETRY / SWITCH labels -->
  <text x="530" y="230" font-size="9" fill="#64748b">RETRY / SWITCH →</text>
  <text x="530" y="240" font-size="9" fill="#64748b">re-execute worker</text>
</svg>
