<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <linearGradient id="llmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="mechGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#f8fafc"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Playbook Execution Pipeline</text>

  <!-- Phase 1: Planning (LLM) -->
  <rect x="30" y="55" width="150" height="80" rx="8" fill="url(#llmGrad)" opacity="0.9"/>
  <text x="105" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white">Phase 1</text>
  <text x="105" y="97" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Planning Worker</text>
  <text x="105" y="113" text-anchor="middle" font-size="9" fill="white" opacity="0.7">AgentExec — LLM</text>
  <text x="105" y="127" text-anchor="middle" font-size="9" fill="white" opacity="0.7">selects playbooks</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="95" x2="210" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Pre-processing (Mechanical) -->
  <rect x="215" y="55" width="150" height="80" rx="8" fill="url(#mechGrad)" opacity="0.9"/>
  <text x="290" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white">Phase 2</text>
  <text x="290" y="97" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Pre-Processing</text>
  <text x="290" y="113" text-anchor="middle" font-size="9" fill="white" opacity="0.7">Playbook → Workflow</text>
  <text x="290" y="127" text-anchor="middle" font-size="9" fill="white" opacity="0.7">rest-request: steps</text>

  <!-- Arrow 2→3 -->
  <line x1="365" y1="95" x2="395" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Domain Workers (LLM) -->
  <rect x="400" y="55" width="150" height="80" rx="8" fill="url(#llmGrad)" opacity="0.9"/>
  <text x="475" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white">Phase 3</text>
  <text x="475" y="97" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Domain Workers</text>
  <text x="475" y="113" text-anchor="middle" font-size="9" fill="white" opacity="0.7">AgentExec — LLM</text>
  <text x="475" y="127" text-anchor="middle" font-size="9" fill="white" opacity="0.7">judgment calls only</text>

  <!-- Arrow 3→4 -->
  <line x1="550" y1="95" x2="580" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 4: Post-processing (Mechanical) -->
  <rect x="585" y="55" width="110" height="80" rx="8" fill="url(#mechGrad)" opacity="0.9"/>
  <text x="640" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white">Phase 4</text>
  <text x="640" y="97" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Post-Process</text>
  <text x="640" y="113" text-anchor="middle" font-size="9" fill="white" opacity="0.7">Playbook →</text>
  <text x="640" y="127" text-anchor="middle" font-size="9" fill="white" opacity="0.7">notify, store</text>

  <!-- Legend -->
  <rect x="30" y="160" width="14" height="14" rx="3" fill="url(#llmGrad)" opacity="0.9"/>
  <text x="50" y="172" font-size="10" fill="#475569">LLM reasoning</text>
  <rect x="140" y="160" width="14" height="14" rx="3" fill="url(#mechGrad)" opacity="0.9"/>
  <text x="160" y="172" font-size="10" fill="#475569">Mechanical (no LLM)</text>

  <!-- Compilation detail box -->
  <rect x="30" y="195" width="660" height="130" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="218" font-size="12" font-weight="600" fill="#1e293b">Compilation Pipeline</text>

  <!-- Flow: Playbook YAML → PlaybookCompiler → Workflow → FlowWorkerFunction → SWF SDK -->
  <rect x="50" y="235" width="100" height="36" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="250" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">.playbook.yaml</text>
  <text x="100" y="262" text-anchor="middle" font-size="8" fill="#92400e">authoring format</text>

  <line x1="150" y1="253" x2="175" y2="253" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="235" width="115" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="237" y="250" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">PlaybookCompiler</text>
  <text x="237" y="262" text-anchor="middle" font-size="8" fill="#1e40af">compile(doc)</text>

  <line x1="295" y1="253" x2="320" y2="253" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="325" y="235" width="90" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="370" y="250" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">Workflow</text>
  <text x="370" y="262" text-anchor="middle" font-size="8" fill="#1e40af">SWF 1.0 types</text>

  <line x1="415" y1="253" x2="440" y2="253" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="445" y="235" width="110" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="500" y="250" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">FlowWorker</text>
  <text x="500" y="262" text-anchor="middle" font-size="8" fill="#1e40af">FunctionHandler</text>

  <line x1="555" y1="253" x2="580" y2="253" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="585" y="235" width="90" height="36" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="630" y="250" text-anchor="middle" font-size="9" font-weight="500" fill="#3730a3">SWF SDK</text>
  <text x="630" y="262" text-anchor="middle" font-size="8" fill="#3730a3">execution engine</text>

  <text x="360" y="310" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Playbooks are the language. SWF 1.0 is the engine. Same execution, better authoring.</text>
</svg>
